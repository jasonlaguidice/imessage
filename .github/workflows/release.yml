name: Release

# Pushing a v* tag runs tests, builds the Linux binary and the macOS
# extract-key helper, and publishes a GitHub Release. The Docker image for the
# same tag is built by docker.yml.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-linux:
    name: Test and build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"  # keep in sync with RUST_MIN_VERSION in the Makefile

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake pkg-config git curl \
            libolm-dev libclang-dev libssl-dev libunicorn-dev \
            protobuf-compiler sqlite3

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pkg/rustpushgo/target
          key: cargo-linux-${{ hashFiles('**/Cargo.lock', 'third_party/rustpush-upstream.sha') }}
          restore-keys: cargo-linux-

      - name: Build
        run: make build

      - name: Test
        run: go test -count=1 ./imessage/... ./pkg/connector/...

      - name: Create tarball
        run: tar czf matrix-rustpush-linux-amd64.tar.gz matrix-rustpush scripts/bootstrap-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: matrix-rustpush-linux-amd64.tar.gz
          retention-days: 1

  build-extract-key:
    name: Build extract-key (macOS)
    needs: build-linux  # don't spend macOS minutes if tests fail
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/extract-key/go.mod
          check-latest: true

      - run: make extract-key

      - uses: actions/upload-artifact@v4
        with:
          name: extract-key-macos
          path: extract-key
          retention-days: 1

  release:
    name: Create Release
    needs: [build-linux, build-extract-key]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$GITHUB_REF_NAME" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          {
            echo "## Changes"; echo
            git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD
            echo; echo; echo "## Checksums"; echo '```'
            sha256sum artifacts/linux-amd64/*.tar.gz artifacts/extract-key-macos/extract-key
            echo '```'
          } > changelog.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: changelog.md
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true
          files: |
            artifacts/linux-amd64/matrix-rustpush-linux-amd64.tar.gz
            artifacts/extract-key-macos/extract-key
